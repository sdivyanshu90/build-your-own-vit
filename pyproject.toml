[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vit"
version = "1.0.0"
description = "Build Your Own Vision Transformer — a production-grade, from-scratch ViT in PyTorch with training, serving, and MLOps tooling."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Build Your Own ViT Contributors" }]
keywords = ["vision-transformer", "vit", "pytorch", "deep-learning", "image-classification", "transformer"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "numpy>=1.24,<2.0",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "tqdm>=4.66",
    "pillow>=10.0",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20",
]
export = [
    "onnx>=1.15",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.6",
    "types-PyYAML>=6.0",
]
all = [
    "vit[serve,export,dev]",
]

[project.urls]
Homepage = "https://github.com/your-org/build-your-own-vit"
Documentation = "https://github.com/your-org/build-your-own-vit/tree/main/docs"
Repository = "https://github.com/your-org/build-your-own-vit"
Changelog = "https://github.com/your-org/build-your-own-vit/blob/main/CHANGELOG.md"

[project.scripts]
vit = "vit.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vit = ["py.typed"]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "N",   # pep8-naming
]
ignore = [
    "N812",   # lowercase imported as non-lowercase (e.g. functional as F)
    "B008",   # function call in default argument (FastAPI Depends/File pattern)
    "RUF002", # ambiguous unicode in docstrings (math symbols: x, ~, lambda, ...)
    "RUF003", # ambiguous unicode in comments (same rationale)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["vit"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require a CUDA device",
    "integration: end-to-end integration tests",
]
filterwarnings = [
    "ignore::DeprecationWarning:torchvision.*",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["vit"]
omit = ["*/__main__.py"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
plugins = ["pydantic.mypy"]
exclude = ["tests/", "build/"]

[[tool.mypy.overrides]]
module = ["torchvision.*", "onnx.*", "prometheus_client.*", "tqdm.*"]
ignore_missing_imports = true
