# Local orchestration for the ViT inference service + a Prometheus scraper.
# Usage:
#   docker compose up --build
# Provide a trained checkpoint by mounting it and setting VIT_MODEL_CHECKPOINT.

services:
  vit-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: build-your-own-vit:latest
    ports:
      - "8080:8080"
    environment:
      VIT_MODEL_CHECKPOINT: ${VIT_MODEL_CHECKPOINT:-/models/best.pt}
      VIT_DEVICE: ${VIT_DEVICE:-cpu}
      VIT_LOG_JSON: "true"
      VIT_RATE_LIMIT_RPM: "120"
      VIT_ENABLE_METRICS: "true"
    volumes:
      # Mount a directory containing your trained best.pt as /models (read-only).
      - ${VIT_MODELS_DIR:-./outputs}:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - vit-api
    restart: unless-stopped
